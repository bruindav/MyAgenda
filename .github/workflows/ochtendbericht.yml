name: Ochtendbericht

on:
  schedule:
    - cron: '30 5 * * *'
    - cron: '30 6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: "Forceer versturen, ook buiten het 07:30-venster (voor testen)"
        type: boolean
        default: true

jobs:
  stuur-bericht:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installeer dependencies
        working-directory: scripts/ochtendbericht
        run: npm install

      - name: Stuur ochtendbericht
        working-directory: scripts/ochtendbericht
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ONTVANGERS: ${{ secrets.ONTVANGERS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          FORCE: ${{ inputs.force && '1' || '0' }}
        run: node index.js
