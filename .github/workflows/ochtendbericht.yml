name: Ochtendbericht 

on:
  schema:
    - cron: '30 5 * * *'
    - cron: '30 6 * * *'
  workflow_verzending:
    ingangen:
      force:
        description: "Forceer versturen, ook buiten het 07:30-venster (voor testen)"
        type: boolean
        default: true

jobs:
  stuur-bericht:
    doorloopt: ubuntu-laatste
    steps:
      - gebrukt: acties/checkout@v4

      - gebrukt: acties/setup-node@v4
        met:
          knoppuntversie: '20'

      - name: Installeer afhankelijkheden
        werkmap: scripts/ochtendbericht
        run: npm install

      - name: Stuur ochtendbericht
        werkmap: scripts/ochtendbericht
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          MIJN_UID: ${{ geheimen.MIJN_UID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ONTVANGERS: ${{ secrets.ONTVANGERS }}
          FORCE: ${{ ingangen.force && '1' || '0' }}
        run: node index.js
